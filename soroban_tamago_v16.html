<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8f1">
<title>そろばんのたまご ― 家庭学習で、そだてよう！</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff8f1;color:#493a35;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
header{background:linear-gradient(135deg,#fff,#fff0d8);padding:13px 15px;position:sticky;top:0;z-index:10;border-bottom:1px solid #efdfd0}
h1{font-size:22px;margin:0;color:#5a463b}h2{font-size:18px;margin:0 0 10px}.sub,.small{font-size:12px;color:#8b776b}
main{max-width:560px;margin:auto;padding:10px 12px 94px}.card{background:#fff;border:1px solid #f0e2d7;border-radius:22px;padding:14px;margin:10px 0;box-shadow:0 4px 18px #5a3d2510}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
button{border:0;border-radius:14px;padding:12px;background:#fff0df;color:#5b463c;font-weight:800;font-size:13px}button.primary{background:#ef6f98;color:#fff}button:disabled{opacity:.45}
.hero{background:linear-gradient(180deg,#fff,#fff1d9);border-radius:22px;padding:14px;text-align:center}
.petimg{width:190px;height:160px;object-fit:contain;display:block;margin:auto}.petgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.petbox{border:2px solid #eee0d3;border-radius:17px;padding:7px;text-align:center;background:#fffaf5}.petbox.selected{border-color:#ef6f98;background:#fff1f5}.petbox img{width:112px;height:92px;object-fit:contain}
.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#fff0df;font-size:11px}.bar{height:13px;background:#eee5dd;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#ef6f98}
.notice{background:#fff4d8;border-radius:15px;padding:11px;font-size:13px;line-height:1.6}.warn{background:#fff0f0}.ok{background:#eef9f1}.pink{background:#fff0f6}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.item{border:1px solid #eee0d3;border-radius:14px;padding:9px;text-align:center;font-size:11px;background:#fffaf7}
.badge{display:inline-block;background:#f1e9e2;border-radius:20px;padding:4px 8px;font-size:11px}.coins{font-weight:900}
.stagegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.stage{border:1px solid #eaded4;border-radius:11px;padding:6px;text-align:center;font-size:10px}.stage.done{background:#fff0f6;border-color:#ef6f98}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #eadfd5;display:flex;justify-content:space-around;padding:7px;z-index:20}.bottom button{background:none;padding:6px 4px;font-size:10px}
.toast{position:fixed;left:12px;right:12px;bottom:72px;background:#493a35;color:#fff;padding:13px;border-radius:16px;z-index:30;text-align:center;box-shadow:0 6px 20px #0003}

.parent-btn{position:fixed;right:12px;top:13px;z-index:30;border:1px solid #eaded4;background:#fff;border-radius:14px;padding:8px 10px;font-size:11px;font-weight:800;color:#5b463c}
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;padding:18px;z-index:100}
.modalbox{width:min(430px,100%);background:#fff;border-radius:24px;padding:20px;box-shadow:0 12px 40px #0004}
.pinrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.pinrow input{text-align:center;font-size:25px;padding:10px;border:1px solid #e4d7cc;border-radius:12px;width:100%}.pinone{width:100%;font-size:28px;letter-spacing:10px;text-align:center;padding:14px;border:2px solid #ead7c9;border-radius:14px}
.childrow{display:flex;gap:8px;align-items:center;border:1px solid #eee0d3;border-radius:14px;padding:9px;margin:7px 0}
.childrow .grow{flex:1}.danger{background:#ffe9e9;color:#a23d3d}
.lock{font-size:34px;text-align:center;margin:6px}.danger{background:#ffe9e9;color:#a23d3d}


/* ===== 毎日触りたくなる演出：第13版 ===== */
.daily-card{background:linear-gradient(135deg,#fff8e8,#fff0f6);border:1px solid #f2dfc8}
.mission{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:#fff}
.mission-icon{font-size:30px}.mission-main{flex:1}.mission-title{font-weight:900}.mission-bar{height:9px;background:#eee2d9;border-radius:99px;overflow:hidden;margin-top:6px}.mission-bar i{display:block;height:100%;background:#f06a9a;border-radius:99px}
.time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.time-btn{border:1px solid #eaded4!important;background:#fff!important;border-radius:16px!important;padding:14px 6px!important;font-size:16px!important;font-weight:900!important}
.time-btn.recommend{border:2px solid #f06a9a!important;background:#fff0f6!important}
.time-note{font-size:11px;color:#8c7469;text-align:center;margin-top:-3px}
.cheer{font-size:15px;line-height:1.65;background:#fff;border-radius:18px;padding:12px;border:1px solid #eee0d5}
.reward-overlay{position:fixed;inset:0;background:rgba(48,31,25,.48);z-index:300;display:flex;align-items:center;justify-content:center;padding:18px}
.reward-box{width:min(430px,100%);background:#fff;border-radius:28px;padding:24px;text-align:center;box-shadow:0 20px 60px #0005;animation:pop .28s ease-out}
.reward-pet{width:150px;height:130px;object-fit:contain;display:block;margin:0 auto 4px}
.reward-title{font-size:24px;font-weight:1000;margin:6px 0}
.reward-points{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0}
.reward-chip{background:#fff3d8;border-radius:999px;padding:9px 14px;font-weight:900}
.confetti{position:fixed;top:-20px;font-size:20px;animation:fall 1.4s linear forwards;z-index:301}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fall{to{transform:translateY(105vh) rotate(520deg);opacity:0}}
@media(max-width:430px){.time-grid{grid-template-columns:repeat(2,1fr)}.reward-pet{width:135px;height:115px}}

</style>
</head>

<header><h1>🥚 そろばんのたまご</h1><div class="sub">家庭学習で、そだてよう！</div>

function saveGame(){
  try{localStorage.setItem(GAME_KEY,JSON.stringify(S));}catch(e){}

function loadGame(){
  try{
    const raw=localStorage.getItem(GAME_KEY);
    if(raw){
      const x=JSON.parse(raw);

}

function P(){let c=child();return c.pets.find(p=>p.id===c.selected)||c.pets[0]}
function todayKey(){let d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function todayRegistered(c){return c.lastRegistered===todayKey()}
function childTodayText(c){return todayRegistered(c)?`✅ 今日 ${c.lastMinutes||0}分 登録済み`:"⚠️ 今日の練習は未登録"}
function age(p){return Math.floor((Date.now()-p.last)/86400000)}
function status(p){let d=age(p);return d>=7?"🌟 星になる":d>=6?"⚠️ 明日で星":d>=5?"😢 元気がない":d>=3?"🥺 ちょっと寂しい":"❤️ 元気！"}
function stage(exp){let s=stages[0];for(const x of stages)if(exp>=x[2])s=x;return s}
function next(exp){for(const x of stages)if(exp<x[2])return x;return null}
function level(exp){return Math.floor(exp/100)+1}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function showToast(t){let d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}

function dayDiff(a,b){
  const x=new Date(a.getFullYear(),a.getMonth(),a.getDate());
  const y=new Date(b.getFullYear(),b.getMonth(),b.getDate());
  return Math.round((y-x)/86400000);
}
function streakAfter(p){
  if(!p.last)return 1;
  const last=new Date(p.last),now=new Date();
  return dayDiff(last,now)===1?(p.streak||0)+1:1;
}
function dailyTarget(){
  const c=child();
  if(c && Number(c.dailyTarget)>0) return Number(c.dailyTarget);
  const d=new Date();
  return [15,20,20,30,20,15,30][d.getDay()];
}
function petCheer(id,min,streak){
  const lines={
    "文鳥":[`「${min}分もがんばったの？えらい！」`,`「明日もいっしょに練習しようね♪」`],
    "インコ":[`「${min}分！すごいスピードで成長中！」`,`「ピピッ！今日も大成功！」`],
    "オカメ":[`「連続${streak}日！その調子、その調子♪」`,`「いっしょに続けるのがいちばん！」`],
    "シマエナガ":[`「今日の一歩が、未来の大きな成長だよ。」`,`「ゆっくりでも、毎日なら強くなるよ。」`]
  };
  const a=lines[id]||lines["文鳥"];
  return a[Math.floor(Math.random()*a.length)];
}
function showReward(p,b,min,exp,coin,gift,grew){
  const emojis=["🎉","⭐","✨","🎈","🌟","🪙"];
  emojis.forEach((e,i)=>{
    const d=document.createElement("div");d.className="confetti";d.textContent=e;
    d.style.left=(8+Math.random()*84)+"%";d.style.animationDelay=(i*0.05)+"s";document.body.appendChild(d);
    setTimeout(()=>d.remove(),1700);
  });
  const giftText=gift?`<div class="reward-chip">🎁 ${esc(gift)} GET!</div>`:"";
  const growText=grew?`<div class="notice ok" style="margin-top:10px"><b>🎊 成長したよ！</b><br>${esc(grew)}</div>`:"";
  const div=document.createElement("div");div.className="reward-overlay";
  div.innerHTML=`<div class="reward-box">
    <img class="reward-pet" src="${b.img}">
    <div class="reward-title">🎉 きょうもできた！</div>
    <div class="cheer">${esc(petCheer(p.id,min,p.streak))}</div>
    <div class="reward-points">
      <div class="reward-chip">⭐ +${exp} EXP</div>
      <div class="reward-chip">🪙 +${coin}</div>
      ${giftText}
    </div>
    ${growText}
    <button class="primary" style="width:100%;margin-top:14px" onclick="this.closest('.reward-overlay').remove()">🐦 ペットを見にいく</button>
  </div>`;
  document.body.appendChild(div);
}

function cselectPractice(id){child().selected=id;practice()}
function register(min){
let c=child();
if(todayRegistered(c))return showToast("今日はもう登録済みです。明日また練習しよう！");
let p=P(),b=B(p.id),before=stage(p.exp),oldStreak=p.streak||0;
c.achievements=c.achievements||[];
let newStreak=streakAfter(p);
let exp=min,coin=min;
if(p.id==="インコ")exp=Math.round(min*1.15);
if(p.id==="オカメ"){let streakBonus=Math.min(30,oldStreak*5);exp+=streakBonus}
if(p.id==="シマエナガ"&&oldStreak>=14)coin+=20;
p.exp+=exp;
p.last=Date.now();
p.lastDate=todayKey();
p.streak=newStreak;
c.lastRegistered=todayKey();
c.lastMinutes=min;
c.coin+=coin;
let gift=null;
let giftRate=p.id==="文鳥"?.48:.15;
if(Math.random()<giftRate){let it=shopItems[Math.floor(Math.random()*shopItems.length)];p.items.push(it[0]);p.lastGift=it[1];gift=it[1]}
if(min>=30&&!c.achievements.includes("30分練習"))c.achievements.push("30分練習");
if(newStreak>=3&&!c.achievements.includes("3日連続"))c.achievements.push("3日連続");
if(newStreak>=7&&!c.achievements.includes("7日連続"))c.achievements.push("7日連続");
c.achievements=c.achievements||[];
saveGame();
let after=stage(p.exp);
home();
let grew=(after[1]!==before[1])?`${b.name}が「${after[1]}」になりました！`:null;
setTimeout(()=>showReward(p,b,min,exp,coin,gift,grew),120);
}

/* ===== 保護者画面 ===== */
const PARENT_KEY="soroban_parent_v1";
let parentTimer=null;
function parentData(){
  try{
    return JSON.parse(localStorage.getItem(PARENT_KEY)) || {
      pin:"",
      fails:0,
      lockedUntil:0,
      children:["はなこちゃん"]
    };
  }catch(e){ return {pin:"",fails:0,lockedUntil:0,children:["はなこちゃん"]}; }
}
function saveParent(x){localStorage.setItem(PARENT_KEY,JSON.stringify(x))}
function parentOpen(){
  const d=parentData();
  if(Date.now()<d.lockedUntil){
    parentLockedScreen();
    return;
  }
  if(!d.pin) parentSetup(); else parentPin();
}
function parentLockedScreen(){
  const d=parentData();
  const remain=()=>Math.max(0,d.lockedUntil-Date.now());
  app.innerHTML=`<div class="card">
    <div class="lock">🔒</div>
    <h2 style="text-align:center">保護者画面はロック中です</h2>
    <div class="notice warn" style="text-align:center">
      3回パスコードを間違えたため、<br>安全のため一時的にロックしています。
    </div>
    <div id="lockcount" style="font-size:32px;font-weight:900;text-align:center;margin:18px 0">--:--</div>
    <p class="small" style="text-align:center">ロックが解除されるまでお待ちください。</p>
    <button style="width:100%" onclick="home()">子どもの画面へ戻る</button>
    <br><br><button class="danger" style="width:100%" onclick="testUnlock()">🧪 試作品の確認：ロックを解除</button>
    <p class="small" style="text-align:center;margin-bottom:0">※第8版の動作確認用。正式版では削除します。</p>
  </div>`;
  if(parentTimer)clearInterval(parentTimer);
  parentTimer=setInterval(()=>{
    const ms=remain();
    const el=document.getElementById("lockcount");
    if(!el){clearInterval(parentTimer);return}
    if(ms<=0){
      clearInterval(parentTimer);
      const d2=parentData();d2.lockedUntil=0;d2.fails=0;saveParent(d2);
      parentPin();
      showToast("✅ ロックが解除されました");
      return;
    }
    const total=Math.ceil(ms/1000),m=Math.floor(total/60),s=total%60;
    el.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  },250);
  const total=Math.ceil(remain()/1000),m=Math.floor(total/60),s=total%60;
  document.getElementById("lockcount").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function testUnlock(){
  if(!confirm("試作品の確認用にロックを解除します。よろしいですか？"))return;
  const d=parentData();d.lockedUntil=0;d.fails=0;saveParent(d);
  parentPin();showToast("🧪 テスト用にロックを解除しました");
}

function parentSetup(){
  app.innerHTML=`<div class="modal" style="position:fixed"><div class="modalbox">
    <div class="lock">🔐</div>
    <h2 style="text-align:center">保護者用パスコード設定</h2>
    <div class="notice">4桁の数字を設定してください。<br><b>3回間違えると10分間ロック</b>されます。</div>
    <p class="small">お子さんの画面から保護者ページを開くときに使います。</p>
    <input id="parentPinOne" class="pinone" inputmode="numeric" autocomplete="new-password" maxlength="4" pattern="[0-9]*" type="password" placeholder="••••">
    <br><br>
    <button class="primary" style="width:100%" onclick="saveNewPin()">この4桁で設定する</button>
    <br><br><button style="width:100%" onclick="home()">キャンセル</button>
  </div></div>`;
  setTimeout(()=>document.getElementById("parentPinOne")?.focus(),100);
}

function pinNext(i){
  const el=document.getElementById("pin"+i);
  el.value=el.value.replace(/\D/g,"").slice(0,1);
  if(el.value && i<3)document.getElementById("pin"+(i+1)).focus();
}
function getPin(){
  const one=document.getElementById("parentPinOne");
  if(one) return (one.value||"").replace(/\D/g,"").slice(0,4);
  return [0,1,2,3].map(i=>document.getElementById("pin"+i)?.value||"").join("");
}

function saveNewPin(){
  const p=getPin();
  if(!/^\d{4}$/.test(p))return showToast("4桁の数字を入力してください");
  const d=parentData();d.pin=p;d.fails=0;d.lockedUntil=0;saveParent(d);
  showToast("🔐 パスコードを設定しました");
  setTimeout(parentPage,250);
}
function parentPin(){
  app.innerHTML=`<div class="modal" style="position:fixed"><div class="modalbox">
    <div class="lock">🔐</div><h2 style="text-align:center">保護者用ページ</h2>
    <p class="small" style="text-align:center">4桁のパスコードを入力してください</p>
    <input id="parentPinOne" class="pinone" inputmode="numeric" autocomplete="current-password" maxlength="4" pattern="[0-9]*" type="password" placeholder="••••">
    <br><br><button class="primary" style="width:100%" onclick="checkPin()">開く</button>
    <br><br><button style="width:100%" onclick="home()">戻る</button>
  </div></div>`;
  setTimeout(()=>document.getElementById("parentPinOne")?.focus(),100);
}

function checkPin(){
  const d=parentData();
  if(Date.now()<d.lockedUntil){
    const sec=Math.ceil((d.lockedUntil-Date.now())/1000);
    return showToast(`🔒 ロック中です。あと約${Math.ceil(sec/60)}分です`);
  }
  if(getPin()===d.pin){
    d.fails=0;saveParent(d);parentPage();
  }else{
    d.fails=(d.fails||0)+1;
    if(d.fails>=3){
      d.fails=0;d.lockedUntil=Date.now()+10*60*1000;saveParent(d);
      app.innerHTML=`<div class="card"><div class="lock">🔒</div><h2 style="text-align:center">10分間ロックしました</h2>
      <div class="notice warn">パスコードを3回間違えたため、保護者用ページを10分間使えません。<br><br>お子さんの練習画面は通常どおり利用できます。</div>
      <br><button class="primary" style="width:100%" onclick="home()">ホームへ戻る</button></div>`;
    }else{
      saveParent(d);
      showToast(`❌ パスコードが違います（あと${3-d.fails}回）`);
      parentPin();
    }
  }
}
function parentPage(){
  const d=parentData();
  const c=child();
  app.innerHTML=`<div class="card"><div class="row"><h2>👨‍👩‍👧 保護者ページ</h2><button onclick="home()">閉じる</button></div>
  <div class="notice">🔐 保護者ページは4桁パスコードで保護されています。<br>3回間違えると10分間ロックします。<br><br>📱 この試作品では、練習記録はこの端末のブラウザに保存され、ページを閉じても残ります。</div></div>
  <div class="card"><h2>👧 お子さんの管理</h2>
    ${S.children.map((x,i)=>`<div class="childrow"><div class="grow"><b>${esc(x.name)}</b><br><span class="small">ペット ${x.pets.length}匹・コイン 🪙${x.coin}</span><br><span class="small">${childTodayText(x)}・🎯 目標 ${Number(x.dailyTarget)||20}分</span></div>
    <button onclick="switchChild(${i})">表示</button>${S.children.length>1?`<button class="danger" onclick="removeChild(${i})">削除</button>`:""}</div>`).join("")}
    <br><button class="primary" style="width:100%" onclick="addChild()">＋ お子さんを追加する</button>
  </div>
  <div class="card"><h2>🔑 パスコード</h2><button onclick="changePin()" style="width:100%">4桁パスコードを変更する</button></div>
  <div class="card"><h2>📊 ${esc(c.name)}の状況</h2>
    <div class="notice ${todayRegistered(c)?'ok':'warn'}"><b>${childTodayText(c)}</b><br>
    ${todayRegistered(c)?'今日の練習は登録されています。':'今日の練習がまだ登録されていません。'}</div>
    <br>
    ${c.pets.map(p=>`<div class="childrow"><div class="grow"><b>🐦 ${B(p.id).name}</b><br><span class="small">${status(p)}・${p.exp} EXP・連続${p.streak}日・最後の練習 ${age(p)}日前</span></div></div>`).join("")}
  </div>
  <div class="card daily-card"><h2>🎯 ${esc(c.name)}さんの今日の目標時間</h2>
    <div class="notice">お子さんごとに目標を設定できます。設定した時間が、その子のホーム画面の「今日のミッション」に反映されます。</div>
    <br><div class="time-grid">${[5,10,15,20,30,40,45,60,90,120].map(m=>`<button class="time-btn ${(Number(c.dailyTarget)||20)===m?'recommend':''}" onclick="setChildTarget(${m})">${m}分${(Number(c.dailyTarget)||20)===m?"<div class='time-note'>🎯 現在の目標</div>":""}</button>`).join("")}</div>
  </div>
  <div class="card daily-card"><h2>📝 今日の練習時間を登録</h2>
    ${todayRegistered(c)?`<div class="notice ok"><b>✅ ${esc(c.name)}さんは今日登録済み</b><br>登録時間：${c.lastMinutes||0}分<br><br>※重要：練習時間の登録は1日1回です。</div>`
    :`<div class="notice"><b>🔐 保護者専用</b><br>ここから登録した時間だけが、ペットのEXP・コイン・連続日数に反映されます。</div>
    <br><h3 style="margin:0 0 8px">① 育てるペット</h3>
    <div class="petgrid">${c.pets.map(x=>{let z=B(x.id);return `<div class="petbox ${x.id===c.selected?'selected':''}" onclick="parentSelectPet('${x.id}')"><img src="${z.img}"><b>${z.name}</b><br><span class="small">${status(x)}</span></div>`}).join("")}</div>
    <br><h3 style="margin:0 0 8px">② 練習時間</h3>
    <div class="time-grid">${[10,15,20,30,40,60,90,120].map(m=>`<button class="time-btn ${m===dailyTarget()?'recommend':''}" onclick="parentRegister(${m})">${m}分${m===dailyTarget()?"<div class='time-note'>🎯 今日の目標</div>":""}</button>`).join("")}</div>
    <p class="small" style="text-align:center;margin-top:10px">登録は1日1回です。登録後は変更できません。</p>`}
  </div>`;
}

function parentSelectPet(id){
  child().selected=id;
  saveGame();
  parentPage();
}
function parentRegister(min){
  const c=child();
  if(todayRegistered(c))return showToast("今日はもう登録済みです。明日また登録できます。");
  const p=P(),b=B(p.id),before=stage(p.exp),oldStreak=p.streak||0;
  c.achievements=c.achievements||[];
  const newStreak=streakAfter(p);
  let exp=min,coin=min;
  if(p.id==="インコ")exp=Math.round(min*1.15);
  if(p.id==="オカメ")exp+=Math.min(30,oldStreak*5);
  if(p.id==="シマエナガ"&&oldStreak>=14)coin+=20;
  p.exp+=exp;p.last=Date.now();p.lastDate=todayKey();p.streak=newStreak;
  c.lastRegistered=todayKey();c.lastMinutes=min;c.coin+=coin;
  let gift=null;
  const giftRate=p.id==="文鳥"?.48:.15;
  if(Math.random()<giftRate){let it=shopItems[Math.floor(Math.random()*shopItems.length)];p.items.push(it[0]);p.lastGift=it[1];gift=it[1]}
  if(min>=30&&!c.achievements.includes("30分練習"))c.achievements.push("30分練習");
  if(newStreak>=3&&!c.achievements.includes("3日連続"))c.achievements.push("3日連続");
  if(newStreak>=7&&!c.achievements.includes("7日連続"))c.achievements.push("7日連続");
  saveGame();
  const after=stage(p.exp);
  parentPage();
  let grew=after[1]!==before[1]?`${b.name}が「${after[1]}」になりました！`:null;
  setTimeout(()=>showReward(p,b,min,exp,coin,gift,grew),120);
}


function selectTodayPet(id){
  const c=child();
  c.selected=id;
  saveGame();
  home();
  showToast(`🐦 今日育てるペットを ${B(id).name} にしました`);
}
function setChildTarget(minutes){
  const c=child();
  const m=Number(minutes);
  if(![5,10,15,20,30,40,45,60,90,120].includes(m))return showToast("目標時間を選択してください");
  c.dailyTarget=m;
  saveGame();
  parentPage();
  showToast(`🎯 ${c.name}さんの今日の目標を${m}分にしました`);
}

function switchChild(i){S.child=i;child().selected=child().selected||child().pets[0]?.id;saveGame();parentPage();showToast(`👧 ${child().name}に切り替えました`)}
function addChild(){
  const name=prompt("お子さんの名前を入力してください");
  if(!name||!name.trim())return;
  S.children.push({
    name:name.trim(),coin:0,dailyTarget:20,
    pets:[
      {id:"文鳥",exp:0,last:Date.now(),streak:0,items:[],stars:0}
    ],
    lastRegistered:null,achievements:[]
  });
  S.child=S.children.length-1;child().selected="文鳥";saveGame();parentPage();
}
function removeChild(i){
  if(!confirm(`「${S.children[i].name}」を削除しますか？\\nこの試作品では端末内データも削除されます。`))return;
  if(S.children.length<=1)return showToast("お子さんは1人以上必要です");
  S.children.splice(i,1);S.child=Math.min(S.child,S.children.length-1);saveGame();parentPage();
}
function changePin(){
  app.innerHTML=`<div class="modal" style="position:fixed"><div class="modalbox">
    <div class="lock">🔑</div><h2 style="text-align:center">新しい4桁パスコード</h2>
    <input id="parentPinOne" class="pinone" inputmode="numeric" autocomplete="new-password" maxlength="4" pattern="[0-9]*" type="password" placeholder="••••">
    <br><br><button class="primary" style="width:100%" onclick="saveNewPinFromChange()">変更する</button>
    <br><br><button style="width:100%" onclick="parentPage()">キャンセル</button>
  </div></div>`;
  setTimeout(()=>document.getElementById("parentPinOne")?.focus(),100);
}

function saveNewPinFromChange(){
  const p=getPin();
  if(!/^\d{4}$/.test(p))return showToast("4桁の数字を入力してください");
  const d=parentData();d.pin=p;d.fails=0;d.lockedUntil=0;saveParent(d);parentPage();showToast("🔑 パスコードを変更しました");
}

checkStars();home();
