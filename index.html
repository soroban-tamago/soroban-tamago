<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8f1">
<title>そろばんのたまご ― 家庭学習で、そだてよう！</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff8f1;color:#493a35;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
header{background:linear-gradient(135deg,#fff,#fff0d8);padding:13px 15px;position:sticky;top:0;z-index:10;border-bottom:1px solid #efdfd0}
h1{font-size:22px;margin:0;color:#5a463b}h2{font-size:18px;margin:0 0 10px}.sub,.small{font-size:12px;color:#8b776b}
main{max-width:560px;margin:auto;padding:10px 12px 94px}.card{background:#fff;border:1px solid #f0e2d7;border-radius:22px;padding:14px;margin:10px 0;box-shadow:0 4px 18px #5a3d2510}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
button{border:0;border-radius:14px;padding:12px;background:#fff0df;color:#5b463c;font-weight:800;font-size:13px}button.primary{background:#ef6f98;color:#fff}button:disabled{opacity:.45}
.hero{background:linear-gradient(180deg,#fff,#fff1d9);border-radius:22px;padding:14px;text-align:center}
.petimg{width:190px;height:160px;object-fit:contain;display:block;margin:auto}.petgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.petbox{border:2px solid #eee0d3;border-radius:17px;padding:7px;text-align:center;background:#fffaf5}.petbox.selected{border-color:#ef6f98;background:#fff1f5}.petbox img{width:112px;height:92px;object-fit:contain}
.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#fff0df;font-size:11px}.bar{height:13px;background:#eee5dd;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#ef6f98}
.notice{background:#fff4d8;border-radius:15px;padding:11px;font-size:13px;line-height:1.6}.warn{background:#fff0f0}.ok{background:#eef9f1}.pink{background:#fff0f6}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.item{border:1px solid #eee0d3;border-radius:14px;padding:9px;text-align:center;font-size:11px;background:#fffaf7}
.badge{display:inline-block;background:#f1e9e2;border-radius:20px;padding:4px 8px;font-size:11px}.coins{font-weight:900}
.stagegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.stage{border:1px solid #eaded4;border-radius:11px;padding:6px;text-align:center;font-size:10px}.stage.done{background:#fff0f6;border-color:#ef6f98}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #eadfd5;display:flex;justify-content:space-around;padding:7px;z-index:20}.bottom button{background:none;padding:6px 4px;font-size:10px}
.toast{position:fixed;left:12px;right:12px;bottom:72px;background:#493a35;color:#fff;padding:13px;border-radius:16px;z-index:30;text-align:center;box-shadow:0 6px 20px #0003}

.parent-btn{position:fixed;right:12px;top:13px;z-index:30;border:1px solid #eaded4;background:#fff;border-radius:14px;padding:8px 10px;font-size:11px;font-weight:800;color:#5b463c}
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;padding:18px;z-index:100}
.modalbox{width:min(430px,100%);background:#fff;border-radius:24px;padding:20px;box-shadow:0 12px 40px #0004}
.pinrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.pinrow input{text-align:center;font-size:25px;padding:10px;border:1px solid #e4d7cc;border-radius:12px;width:100%}.pinone{width:100%;font-size:28px;letter-spacing:10px;text-align:center;padding:14px;border:2px solid #ead7c9;border-radius:14px}
.childrow{display:flex;gap:8px;align-items:center;border:1px solid #eee0d3;border-radius:14px;padding:9px;margin:7px 0}
.childrow .grow{flex:1}.danger{background:#ffe9e9;color:#a23d3d}
.lock{font-size:34px;text-align:center;margin:6px}.danger{background:#ffe9e9;color:#a23d3d}


/* ===== 毎日触りたくなる演出：第13版 ===== */
.daily-card{background:linear-gradient(135deg,#fff8e8,#fff0f6);border:1px solid #f2dfc8}
.mission{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:#fff}
.mission-icon{font-size:30px}.mission-main{flex:1}.mission-title{font-weight:900}.mission-bar{height:9px;background:#eee2d9;border-radius:99px;overflow:hidden;margin-top:6px}.mission-bar i{display:block;height:100%;background:#f06a9a;border-radius:99px}
.time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.time-btn{border:1px solid #eaded4!important;background:#fff!important;border-radius:16px!important;padding:14px 6px!important;font-size:16px!important;font-weight:900!important}
.time-btn.recommend{border:2px solid #f06a9a!important;background:#fff0f6!important}
.time-note{font-size:11px;color:#8c7469;text-align:center;margin-top:-3px}
.cheer{font-size:15px;line-height:1.65;background:#fff;border-radius:18px;padding:12px;border:1px solid #eee0d5}
.reward-overlay{position:fixed;inset:0;background:rgba(48,31,25,.48);z-index:300;display:flex;align-items:center;justify-content:center;padding:18px}
.reward-box{width:min(430px,100%);background:#fff;border-radius:28px;padding:24px;text-align:center;box-shadow:0 20px 60px #0005;animation:pop .28s ease-out}
.reward-pet{width:150px;height:130px;object-fit:contain;display:block;margin:0 auto 4px}
.reward-title{font-size:24px;font-weight:1000;margin:6px 0}
.reward-points{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0}
.reward-chip{background:#fff3d8;border-radius:999px;padding:9px 14px;font-weight:900}
.confetti{position:fixed;top:-20px;font-size:20px;animation:fall 1.4s linear forwards;z-index:301}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fall{to{transform:translateY(105vh) rotate(520deg);opacity:0}}
@media(max-width:430px){.time-grid{grid-template-columns:repeat(2,1fr)}.reward-pet{width:135px;height:115px}}


/* ===== 卵が孵る演出：第20版 ===== */
.hatch-overlay{position:fixed;inset:0;background:rgba(255,250,244,.96);z-index:500;display:flex;align-items:center;justify-content:center;padding:18px}
.hatch-box{width:min(430px,100%);text-align:center;background:#fff;border-radius:30px;padding:28px 20px;box-shadow:0 18px 60px #0002}
.egg-scene{height:220px;display:flex;align-items:center;justify-content:center;position:relative}
.egg{font-size:125px;line-height:1;animation:eggFloat 1.2s ease-in-out infinite}
.egg.shake{animation:eggShake .75s ease-in-out}
.hatch-pet{width:175px;height:145px;object-fit:contain;animation:hatchPop .65s cubic-bezier(.2,1.4,.4,1)}
.hatch-title{font-size:26px;font-weight:1000;margin:4px 0 8px}
.hatch-sub{font-size:15px;line-height:1.7}
.spark{position:absolute;font-size:24px;animation:sparkPop 1s ease-out forwards}
@keyframes eggFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes eggShake{0%,100%{transform:rotate(0) scale(1)}20%{transform:rotate(-10deg) scale(1.03)}40%{transform:rotate(10deg) scale(1.05)}60%{transform:rotate(-8deg) scale(1.06)}80%{transform:rotate(6deg) scale(1.07)}}
@keyframes hatchPop{0%{transform:scale(.15) rotate(-10deg);opacity:0}70%{transform:scale(1.12) rotate(3deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes sparkPop{0%{transform:scale(.3);opacity:0}25%{opacity:1}100%{transform:translateY(-80px) scale(1.2);opacity:0}}


/* ===== 成長演出：第21版 ===== */
.growth-overlay{position:fixed;inset:0;background:rgba(255,250,244,.97);z-index:510;display:flex;align-items:center;justify-content:center;padding:18px}
.growth-box{width:min(430px,100%);background:#fff;border-radius:30px;padding:26px 20px;text-align:center;box-shadow:0 18px 60px #0002}
.growth-title{font-size:28px;font-weight:1000;margin:5px 0 8px}
.growth-stage{font-size:64px;margin:14px 0;animation:growthPop .7s cubic-bezier(.2,1.4,.4,1)}
.growth-pet{width:190px;height:150px;object-fit:contain;animation:growthPet .8s cubic-bezier(.2,1.4,.4,1)}
.growth-next{background:#fff4d8;border-radius:18px;padding:12px;margin-top:12px;font-weight:800}
@keyframes growthPop{0%{transform:scale(.3) rotate(-15deg);opacity:0}70%{transform:scale(1.18) rotate(5deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes growthPet{0%{transform:scale(.2);opacity:0}65%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}


/* ===== プレゼント・ペットのお部屋：第22版 ===== */
.room{position:relative;min-height:235px;border-radius:24px;padding:12px 12px 48px;background:linear-gradient(180deg,#fff9f0 0%,#fff7fb 62%,#f6eee4 100%);overflow:hidden;border:1px solid #eaded4}
.room-pet{position:absolute;z-index:2;left:50%;top:28px;transform:translateX(-50%);width:175px;height:155px;object-fit:contain}
.room-floor{position:absolute;z-index:1;left:0;right:0;bottom:0;height:58px;background:#eadfcf;border-top:2px solid #dfd0bd}
.room-shelf{position:absolute;z-index:3;left:8%;right:8%;bottom:24px;height:8px;background:#c9a06f;border-radius:8px;box-shadow:0 4px 0 #b78d5d}
.room-item{position:absolute;z-index:4;font-size:32px;animation:itemFloat 2.5s ease-in-out infinite;transform:translateX(-50%);filter:drop-shadow(0 2px 1px #0002)}
.room-empty{position:absolute;z-index:5;left:0;right:0;bottom:5px;text-align:center;font-size:12px;color:#8c7469}
.room-label{position:absolute;z-index:5;left:12px;top:10px;background:#ffffffcc;border-radius:12px;padding:4px 8px;font-size:12px;font-weight:800}
.gift-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gift-card{background:#fff;border:1px solid #eaded4;border-radius:18px;padding:12px;text-align:center}
.gift-icon{font-size:42px;line-height:1.1}
.gift-name{font-weight:900;margin:5px 0}
.love{font-size:18px;letter-spacing:2px}
.gift-reaction{font-size:14px;line-height:1.6;background:#fff7df;border-radius:16px;padding:11px;margin-top:10px}
.gift-overlay{position:fixed;inset:0;background:rgba(48,31,25,.48);z-index:520;display:flex;align-items:center;justify-content:center;padding:18px}
.gift-box{width:min(430px,100%);background:#fff;border-radius:28px;padding:24px;text-align:center;box-shadow:0 20px 60px #0005}
.gift-big{font-size:75px;animation:giftPop .65s cubic-bezier(.2,1.4,.4,1)}
@keyframes giftPop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes itemFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}


.pet-name-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.pet-nickname{font-size:22px;font-weight:1000;color:#5a463b}
.pet-species{font-size:12px;color:#8c7469;background:#fff4e7;border-radius:999px;padding:4px 9px}
.rename-btn{font-size:12px;padding:6px 10px;border-radius:12px;background:#fff4d8;border:1px solid #ead0a0;color:#5a463b;font-weight:800}
.name-modal{position:fixed;inset:0;background:rgba(48,31,25,.45);z-index:530;display:flex;align-items:center;justify-content:center;padding:18px}
.name-box{width:min(400px,100%);background:#fff;border-radius:26px;padding:22px;box-shadow:0 20px 60px #0004}
.name-box input{width:100%;box-sizing:border-box;font-size:20px;padding:13px;border:1px solid #eaded4;border-radius:14px;margin:10px 0}


/* ===== プレゼント画面・リッチルーム：第25版 ===== */
.gift-page{max-width:1180px;margin:0 auto;padding:16px}
.gift-room{
  position:relative;min-height:380px;border:1px solid #eaded4;border-radius:28px;
  overflow:hidden;background:linear-gradient(180deg,#fffaf2 0%,#f7f0e7 70%,#e9dcc9 70%,#dfccb0 100%);
  box-shadow:0 8px 28px rgba(75,50,35,.08)
}
.gift-room:before{
  content:"";position:absolute;inset:0 0 30% 0;
  background:linear-gradient(90deg,rgba(255,255,255,.8),transparent 18%,transparent 82%,rgba(255,255,255,.55));
  pointer-events:none
}
.room-window{position:absolute;left:5%;top:8%;width:28%;height:44%;border:8px solid #fff;background:linear-gradient(#bfe8ff,#eaf8ff);box-shadow:inset 0 0 0 2px #eaded4}
.room-window:after{content:"";position:absolute;left:49%;top:0;bottom:0;width:6px;background:#fff;box-shadow:0 46px 0 -2px #fff}
.room-window:before{content:"";position:absolute;left:0;right:0;top:49%;height:6px;background:#fff}
.room-plant{position:absolute;right:5%;bottom:26%;font-size:74px}
.room-frame{position:absolute;right:12%;top:10%;font-size:54px}
.room-name{position:absolute;left:3%;top:5%;z-index:8;font-weight:1000;font-size:23px;background:#fffaf3aa;padding:4px 8px;border-radius:12px}
.room-species{font-size:12px;color:#4d6b52;background:#dff2d7;border-radius:9px;padding:4px 8px;margin-left:6px}
.room-pet-large{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);width:min(330px,42%);height:280px;object-fit:contain;z-index:5}
.room-perch{position:absolute;left:39%;right:39%;bottom:20%;height:14px;background:#9a6a35;border-radius:20px;z-index:4;box-shadow:0 6px 0 #70461f}
.room-speech{position:absolute;right:9%;top:19%;width:240px;background:#fff;border:1px solid #e8ddd5;border-radius:25px;padding:17px;font-size:18px;line-height:1.5;z-index:9;box-shadow:0 6px 18px #00000010}
.room-speech:after{content:"";position:absolute;left:-18px;bottom:20px;border-width:12px 18px 12px 0;border-style:solid;border-color:transparent #fff transparent transparent}
.gift-shelf{position:absolute;left:5%;right:5%;bottom:4%;height:76px;background:linear-gradient(#c99b5d,#9c6a32);border-radius:8px;z-index:7;box-shadow:0 7px 0 #805126}
.gift-shelf-label{position:absolute;left:3%;bottom:18%;z-index:10;font-weight:900;background:#fffaf3dd;border-radius:12px;padding:7px 10px}
.shelf-item{position:absolute;bottom:10%;z-index:9;font-size:58px;filter:drop-shadow(0 3px 2px #0002);animation:shelfFloat 3s ease-in-out infinite}
@keyframes shelfFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

.friendship-card{display:flex;align-items:center;justify-content:space-between;gap:20px;background:#fff;border:1px solid #eaded4;border-radius:24px;padding:18px 24px;margin-top:12px}
.friendship-hearts{font-size:31px;letter-spacing:4px}
.friendship-bonus{background:#fff0f3;border-radius:18px;padding:12px 18px;min-width:160px}
.gift-page-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:12px}
.gift-rich-card{background:#fff;border:1px solid #eaded4;border-radius:20px;padding:12px;text-align:center;box-shadow:0 3px 12px #00000008}
.gift-rich-icon{font-size:58px;height:74px;display:flex;align-items:center;justify-content:center}
.gift-rich-name{font-weight:900;font-size:16px}
.gift-rich-meta{font-size:13px;margin:5px 0}
.gift-fav{display:inline-block;border-radius:9px;padding:4px 9px;font-weight:900;font-size:12px}
.gift-fav.best{background:#dff5c8;color:#34751c}.gift-fav.good{background:#fff0c8;color:#9b6500}.gift-fav.normal{background:#fff5d8;color:#9a7a25}.gift-fav.bad{background:#e6f2fa;color:#49718b}
.gift-rich-btn{width:100%;margin-top:8px;background:#fff4e7;border:1px solid #f0a0ad;color:#e75d79;border-radius:16px;padding:10px;font-weight:900}
.gift-guide{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:13px;font-weight:800}
@media(max-width:760px){
  .gift-page-grid{grid-template-columns:repeat(2,1fr)}
  .gift-room{min-height:330px}
  .room-pet-large{width:50%;height:230px}
  .room-speech{right:4%;top:17%;width:165px;font-size:14px}
  .friendship-card{flex-direction:column;align-items:flex-start}
  .friendship-bonus{width:100%;box-sizing:border-box}
}


/* ===== ホームのお部屋を整理：第26版 ===== */
.home-room-wrap{margin-top:8px}
.home-room{
  position:relative;
  min-height:260px;
  border:1px solid #eaded4;
  border-radius:24px;
  overflow:hidden;
  background:linear-gradient(180deg,#fffaf4 0%,#fff8f0 64%,#eadfce 64%,#e3d1b8 100%);
}
.home-room-wall{
  position:absolute;left:0;right:0;top:0;height:64%;
  background:
    radial-gradient(circle at 20% 28%,#fff 0 3px,transparent 4px),
    radial-gradient(circle at 78% 35%,#fff 0 2px,transparent 3px),
    linear-gradient(90deg,rgba(255,255,255,.65),transparent 45%,rgba(255,255,255,.45));
}
.home-room-name{
  position:absolute;left:14px;top:12px;z-index:10;
  background:#ffffffdf;border-radius:13px;padding:6px 10px;
  font-size:15px;font-weight:1000;
}
.home-room-species{
  font-size:11px;color:#4d6b52;background:#dff2d7;
  border-radius:9px;padding:3px 7px;margin-left:5px;font-weight:800;
}
.home-room-window{
  position:absolute;left:18px;top:56px;width:92px;height:72px;
  border:5px solid #fff;border-radius:8px;
  background:linear-gradient(#bfeaff,#e9f9ff);
  box-shadow:inset 0 0 0 1px #ded5ca;
}
.home-room-window:before{content:"";position:absolute;left:42%;top:0;bottom:0;width:4px;background:#fff}
.home-room-window:after{content:"";position:absolute;left:0;right:0;top:44%;height:4px;background:#fff}
.home-room-plant{position:absolute;right:20px;top:58px;font-size:48px;z-index:2}
.home-room-perch{
  position:absolute;left:34%;right:34%;top:63%;
  height:9px;background:#9a6a35;border-radius:20px;z-index:4;
  box-shadow:0 4px 0 #70461f;
}
.home-room-pet{
  position:absolute;left:50%;top:34px;transform:translateX(-50%);
  width:145px;height:135px;object-fit:contain;z-index:5;
}
.home-room-shelf{
  position:absolute;left:7%;right:7%;bottom:13px;height:16px;
  background:linear-gradient(#c99b5d,#9c6a32);border-radius:7px;
  z-index:6;box-shadow:0 5px 0 #805126;
}
.home-room-gifts-label{
  position:absolute;left:10px;bottom:36px;z-index:8;
  font-size:12px;font-weight:900;background:#fffaf0dc;
  border-radius:10px;padding:5px 8px;
}
.home-room-gift{
  position:absolute;bottom:25px;z-index:9;font-size:38px;
  filter:drop-shadow(0 2px 1px #0002);
}
.home-room-empty{
  position:absolute;left:50%;bottom:40px;transform:translateX(-50%);
  z-index:8;font-size:11px;color:#8c7469;white-space:nowrap;
}
.home-room-caption{text-align:center;font-size:12px;color:#8c7469;margin:5px 0 0}
.home-pet-title{text-align:center;margin:8px 0 4px}
@media(max-width:600px){
  .home-room{min-height:245px}
  .home-room-pet{width:130px;height:125px;top:40px}
  .home-room-window{left:12px;top:55px;width:75px;height:62px}
  .home-room-plant{right:12px;top:58px;font-size:40px}
  .home-room-perch{left:30%;right:30%;top:64%}
  .home-room-gift{font-size:31px}
}


/* ===== 第27版：鳥画像の背景透過＋お部屋の背景強化 ===== */
.home-room-pet,.room-pet-large,.reward-pet,.petimg{background:transparent!important;mix-blend-mode:normal}
.home-room{
  background:
    radial-gradient(circle at 72% 18%,rgba(255,255,255,.8) 0 2px,transparent 3px),
    linear-gradient(180deg,#fffaf1 0%,#fff6e9 62%,#eadfce 62%,#e0c9a8 100%);
}
.home-room-wall:after{
  content:"";position:absolute;right:15%;top:26%;width:54px;height:46px;
  border:4px solid #c9a47a;border-radius:5px;background:#fff0cf;
  box-shadow:inset 0 0 0 5px #fff8ed;
}
.home-room-wall:before{
  content:"🌸";position:absolute;right:17.2%;top:28%;font-size:28px;z-index:2
}
.gift-already{
  display:block;margin-top:8px;background:#eef4e9;color:#55734d;
  border-radius:16px;padding:9px;font-weight:900;font-size:13px
}


/* 第32版：○○のお部屋をすっきりした「部屋の中」らしい見た目に */
.home-room-clean{
  position:relative;
  overflow:hidden;
  min-height:300px;
  border:1px solid #eadfd3;
  border-radius:22px;
  background:#fffaf5;
  box-shadow:0 6px 18px rgba(120,90,70,.08);
}
.home-room-clean .home-room-wall{
  position:absolute;
  inset:0 0 88px 0;
  background:linear-gradient(180deg,#fffdf9 0%,#fff8ef 100%);
}
.home-room-clean .room-window{
  position:absolute;
  left:28px;
  top:28px;
  width:92px;
  height:70px;
  border:5px solid #fff;
  border-radius:8px;
  background:linear-gradient(135deg,#cfeeff,#eefaff);
  box-shadow:0 2px 8px rgba(100,120,130,.12);
}

function child(){return S.children[S.child]} function B(id){return birds.find(b=>b.id===id)}

const GAME_KEY="soroban_tamago_game_v1";
function saveGame(){
  try{localStorage.setItem(GAME_KEY,JSON.stringify(S));}catch(e){}
}
function loadGame(){
  try{
    const raw=localStorage.getItem(GAME_KEY);
    if(raw){
      const x=JSON.parse(raw);
      if(x && Array.isArray(x.children) && x.children.length){
        S=x;
        S.children.forEach(ch=>(ch.pets||[]).forEach(pt=>{pt.gifts=[...new Set(pt.gifts||[])];}));
      }
    }else{
      saveGame();
    }
  }catch(e){}
}

function P(){let c=child();return c.pets.find(p=>p.id===c.selected)||c.pets[0]}
function todayKey(){let d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function todayRegistered(c){return c.lastRegistered===todayKey()}
function childTodayText(c){return todayRegistered(c)?`✅ 今日 ${c.lastMinutes||0}分 登録済み`:"⚠️ 今日の練習は未登録"}
function age(p){return Math.floor((Date.now()-p.last)/86400000)}
function status(p){let d=age(p);return d>=7?"🌟 星になる":d>=6?"⚠️ 明日で星":d>=5?"😢 元気がない":d>=3?"🥺 ちょっと寂しい":"❤️ 元気！"}
function stage(exp){let s=stages[0];for(const x of stages)if(exp>=x[2])s=x;return s}
function next(exp){for(const x of stages)if(exp<x[2])return x;return null}
function level(exp){return Math.floor(exp/100)+1}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function showToast(t){let d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}

function dayDiff(a,b){
  const x=new Date(a.getFullYear(),a.getMonth(),a.getDate());
  const y=new Date(b.getFullYear(),b.getMonth(),b.getDate());
  return Math.round((y-x)/86400000);
}
function streakAfter(p){
  if(!p.last)return 1;
  const last=new Date(p.last),now=new Date();
  return dayDiff(last,now)===1?(p.streak||0)+1:1;
}
function weekKey(){
  const d=new Date();
  const day=d.getDay();
  const diff=day===0?-6:1-day;
  const monday=new Date(d);
  monday.setDate(d.getDate()+diff);
  return monday.getFullYear()+"-"+String(monday.getMonth()+1).padStart(2,"0")+"-"+String(monday.getDate()).padStart(2,"0");
}
function weekDates(){
  const d=new Date(), day=d.getDay(), diff=day===0?-6:1-day;
  const monday=new Date(d);
  monday.setDate(d.getDate()+diff);
  return Array.from({length:7},(_,i)=>{
    const x=new Date(monday); x.setDate(monday.getDate()+i);
    return x.getFullYear()+"-"+(x.getMonth()+1)+"-"+x.getDate();
  });
}
function weeklyMinutes(c){
  const key=weekKey();
  if(c.weekRecordKey!==key)return 0;
  return (c.weekMinutes||[]).reduce((a,b)=>a+(Number(b)||0),0);
}
function weeklyTarget(c){
  const v=Number(c.weeklyTarget);
  return v>0?v:90;
}
function ensureWeekly(c){
  const key=weekKey();
  if(c.weekRecordKey!==key){
    c.weekRecordKey=key;
    c.weekMinutes=[0,0,0,0,0,0,0];
    saveGame();
  }else if(!Array.isArray(c.weekMinutes)||c.weekMinutes.length!==7){
    c.weekMinutes=[0,0,0,0,0,0,0];
    saveGame();
  }
}
function weeklyRewardClaimed(c){
  return c.weeklyRewardKey===weekKey();

function claimWeeklyReward(c,p,b){
  ensureWeekly(c);
  const total=weeklyMinutes(c), target=weeklyTarget(c), key=weekKey();
  if(total<target || c.weeklyRewardKey===key)return false;
  c.weeklyRewardKey=key;
  const beforeLove=Number(p.love)||0;

c.achievements=c.achievements||[];
saveGame();
let after=stage(p.exp);
renderHome();

setTimeout(()=>showReward(p,b,min,exp,coin,gift,grew),120);
}

  const newStreak=streakAfter(p);
  let exp=min,coin=min;
  if(p.id==="インコ")exp=Math.round(min*1.15);
  if(p.id==="オカメ")exp+=Math.min(30,oldStreak*5);
  if(p.id==="シマエナガ"&&oldStreak>=14)coin+=20;
  p.exp+=exp;p.last=Date.now();p.lastDate=todayKey();p.streak=newStreak;
  c.lastRegistered=todayKey();
  c.lastMinutes=min;
  c.coin+=coin;
  ensureWeekly(c);
  const weekDay=(new Date().getDay()===0?6:new Date().getDay()-1);
  c.weekMinutes[weekDay]=min;
  const weeklyCleared=claimWeeklyReward(c,p,b);
  let gift=null;
  const giftRate=p.id==="文鳥"?.48:.15;
  if(Math.random()<giftRate){let it=shopItems[Math.floor(Math.random()*shopItems.length)];p.items.push(it[0]);p.lastGift=it[1];gift=it[1]}
  if(min>=30&&!c.achievements.includes("30分練習"))c.achievements.push("30分練習");
  if(newStreak>=3&&!c.achievements.includes("3日連続"))c.achievements.push("3日連続");
  if(newStreak>=7&&!c.achievements.includes("7日連続"))c.achievements.push("7日連続");
  saveGame();
  const after=stage(p.exp);
  const grew=after[1]!==before[1];
  parentPage();
  setTimeout(()=>{
    showReward(p,b,min,exp,coin,gift,grew?`${b.name}が「${after[1]}」になりました！`:null);
    if(grew)setTimeout(()=>showGrowth(p,b,before,after),150);
  },120);
}

function setWeeklyTargetForChild(i,minutes){

function showHatch(id, childName){
  const b=B(id);
  const overlay=document.createElement("div");
  overlay.className="hatch-overlay";
  overlay.innerHTML=`<div class="hatch-box">
    <div class="hatch-title">🥚 新しい卵がやってきた！</div>
    <div class="hatch-sub">${esc(childName)}さんの新しいペットです。<br>どんな子が生まれるかな？</div>
    <div class="egg-scene"><div class="egg" id="hatchEgg">🥚</div></div>
    <div class="small">そろばんを練習して、いっしょに育てよう！</div>
  </div>`;
  document.body.appendChild(overlay);
  setTimeout(()=>{
    const egg=document.getElementById("hatchEgg");
    if(egg)egg.classList.add("shake");
  },700);
  setTimeout(()=>{
    if(!document.body.contains(overlay))return;
    overlay.querySelector(".egg-scene").innerHTML=`<img class="hatch-pet" src="${b.img}">`;
    overlay.querySelector(".hatch-title").textContent="🐣 生まれたよ！";
    overlay.querySelector(".hatch-sub").innerHTML=`${esc(b.name)}の赤ちゃんが生まれました！<br><b>今日からこの子を育てよう！</b>`;
    ["✨","⭐","🌟","💛","🎉"].forEach((e,i)=>{
      const s=document.createElement("span");s.className="spark";s.textContent=e;
      s.style.left=(20+i*15)+"%";s.style.top=(42+(i%2)*8)+"%";s.style.animationDelay=(i*.08)+"s";
      overlay.querySelector(".egg-scene").appendChild(s);
    });
    const btn=document.createElement("button");btn.className="primary";btn.style.cssText="width:100%;margin-top:16px";btn.textContent="🐣 この子を育てる";
    btn.onclick=()=>{overlay.remove();openPetRename();};
    overlay.querySelector(".hatch-box").appendChild(btn);
    const back=document.createElement("button");
    back.style.cssText="width:100%;margin-top:8px";
    back.textContent="保護者ページに戻る";
    back.onclick=()=>{overlay.remove();if(parentUnlocked)parentPage();else safeRenderHome();};
    overlay.querySelector(".hatch-box").appendChild(back);
  },1800);
}
