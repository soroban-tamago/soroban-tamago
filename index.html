<style>
*{box-sizing:border-box}body{margin:0;background:#fff8f1;color:#493a35;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
header{background:linear-gradient(135deg,#fff,#fff0d8);padding:13px 15px;position:sticky;top:0;z-index:10;border-bottom:1px solid #efdfd0}
h1{font-size:22px;margin:0;color:#5a463b}h2{font-size:18px;margin:0 0 10px}.sub,.small{font-size:12px;color:#8b776b}
main{max-width:560px;margin:auto;padding:10px 12px 94px}.card{background:#fff;border:1px solid #f0e2d7;border-radius:22px;padding:14px;margin:10px 0;box-shadow:0 4px 18px #5a3d2510}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}

.hero{background:linear-gradient(180deg,#fff,#fff1d9);border-radius:22px;padding:14px;text-align:center}
.petimg{width:190px;height:160px;object-fit:contain;display:block;margin:auto}.petgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.petbox{border:2px solid #eee0d3;border-radius:17px;padding:7px;text-align:center;background:#fffaf5}.petbox.selected{border-color:#ef6f98;background:#fff1f5}.petbox img{width:112px;height:92px;object-fit:contain}
.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#fff0df;font-size:11px}.bar{height:13px;background:#eee5dd;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#ef6f98}
.notice{background:#fff4d8;border-radius:15px;padding:11px;font-size:13px;line-height:1.6}.warn{background:#fff0f0}.ok{background:#eef9f1}.pink{background:#fff0f6}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.item{border:1px solid #eee0d3;border-radius:14px;padding:9px;text-align:center;font-size:11px;background:#fffaf7}
.badge{display:inline-block;background:#f1e9e2;border-radius:20px;padding:4px 8px;font-size:11px}.coins{font-weight:900}
.stagegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.stage{border:1px solid #eaded4;border-radius:11px;padding:6px;text-align:center;font-size:10px}.stage.done{background:#fff0f6;border-color:#ef6f98}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #eadfd5;display:flex;justify-content:space-around;padding:7px;z-index:20}.bottom button{background:none;padding:6px 4px;font-size:10px}
.toast{position:fixed;left:12px;right:12px;bottom:72px;background:#493a35;color:#fff;padding:13px;border-radius:16px;z-index:30;text-align:center;box-shadow:0 6px 20px #0003}

{id:"オカメ",name:"元気オカメインコ",type:"連続練習ボーナスが大きい",img:ASSETS.オカメ},
{id:"シマエナガ",name:"ふわふわシマエナガ風",type:"長期継続で特別アイテム",img:ASSETS.シマエナガ}
];
const stages=[["🥚","たまご",0],["🐣","ふ化",100],["🐥","ヒナ",300],["🐦","子ども",700],["👑","成鳥",1500]];
const shopItems=[["🎀","赤いリボン",100],["👒","麦わらぼうし",150],["👓","まるメガネ",120],["🌸","お花のかんむり",180],["🪽","天使のはね",300],["⭐","星のほうせき",200],["🎒","小さなかばん",180],["🧮","特別そろばん",250],["🌈","虹の羽",400]];
let S={
children:[{
name:"はなこちゃん",coin:1250,
pets:[
{id:"文鳥",exp:820,last:Date.now()-2*86400000,streak:4,items:["🎀","🌸"],stars:0},
{id:"インコ",exp:1250,last:Date.now()-1*86400000,streak:6,items:["👒"],stars:0},
{id:"オカメ",exp:320,last:Date.now()-4*86400000,streak:2,items:[],stars:0},
{id:"シマエナガ",exp:180,last:Date.now()-6*86400000,streak:3,items:[],stars:0}
],
lastRegistered:null,achievements:["はじめの一歩"]
}],child:0};

function child(){return S.children[S.child]} function B(id){return birds.find(b=>b.id===id)}
function P(){let c=child();return c.pets.find(p=>p.id===c.selected)||c.pets[0]}
function todayKey(){let d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function age(p){return Math.floor((Date.now()-p.last)/86400000)}
function status(p){let d=age(p);return d>=7?"🌟 星になる":d>=6?"⚠️ 明日で星":d>=5?"😢 元気がない":d>=3?"🥺 ちょっと寂しい":"❤️ 元気！"}
function stage(exp){let s=stages[0];for(const x of stages)if(exp>=x[2])s=x;return s}
function next(exp){for(const x of stages)if(exp<x[2])return x;return null}
function level(exp){return Math.floor(exp/100)+1}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function showToast(t){let d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}

function home(){
let c=child();let p=P();let b=B(p.id);let s=stage(p.exp),n=next(p.exp);let pct=n?Math.min(100,Math.round((p.exp-s[2])/(n[2]-s[2])*100)):100;
let warning=c.pets.filter(x=>age(x)>=6&&age(x)<7);
app.innerHTML=`
<div class="card"><div class="row"><div><b>👧 ${esc(c.name)}</b><div class="small">育てているペット ${c.pets.length}匹</div></div><div class="coins">🪙 ${c.coin}</div></div></div>
<div class="hero"><img class="petimg" src="${b.img}"><h2>${b.name}</h2><span class="tag">${b.type}</span>
<p><b>Lv.${level(p.exp)}</b>　⭐ ${p.exp} EXP</p><div class="bar"><i style="width:${pct}%"></i></div>
<p class="small">${n?`あと ${n[2]-p.exp} EXPで ${n[0]} ${n[1]}！`:"👑 成鳥になりました！"}</p>
<button class="primary" onclick="practice()">📝 今日の練習を記録する</button></div>
${warning.length?`<div class="card notice warn"><b>⚠️ 星になる前のお知らせ</b><br>${warning.map(x=>`🐦 ${B(x.id).name}は明日で星になります。`).join("<br>")}<br><br><button class="primary" onclick="practice()">練習して元気にする</button></div>`:""}
<div class="card"><h2>🐦 育てているペット</h2><div class="petgrid">${c.pets.map(x=>{let z=B(x.id);return `<div class="petbox ${x.id===p.id?'selected':''}" onclick="cselect('${x.id}')"><img src="${z.img}"><b>${z.name}</b><br><span class="small">${status(x)}・Lv.${level(x.exp)}</span></div>`}).join("")}</div></div>
<div class="card"><h2>🌱 ${b.name}の成長</h2><div class="stagegrid">${stages.map(x=>`<div class="stage ${p.exp>=x[2]?'done':''}"><div style="font-size:22px">${x[0]}</div>${x[1]}<br><span class="small">${x[2]}EXP</span></div>`).join("")}</div></div>
<div class="card notice"><b>📢 複数育成について</b><br>ペットは複数育てられます。ただし、<b>ペットごとに最後の練習日を記録</b>します。増やすほど、星にならないように気にかける難易度が上がります。<br><br>🐦1匹 ⭐　🐦🐦2匹 ⭐⭐　🐦🐦🐦3匹 ⭐⭐⭐　🐦🐦🐦🐦4匹 ⭐⭐⭐⭐</div>`;
}
function cselect(id){child().selected=id;home()}
function practice(){
let c=child(),p=P();let used=c.lastRegistered===todayKey();
app.innerHTML=`<div class="card"><h2>📝 今日の家庭学習</h2>
<div class="notice"><b>📢 重要：登録は1日1回です</b><br>午前20分＋午後30分＝合計50分として、<b>1日1回だけ</b>登録してください。</div>
${used?`<br><div class="notice ok"><b>✅ 今日は登録済みです</b><br>次の登録は明日できます。今日の練習は ${esc(c.lastMinutes||0)}分として記録されています。</div>`:`
<br><h2>① 誰を育てる？</h2><div class="petgrid">${c.pets.map(x=>{let z=B(x.id);return `<div class="petbox ${x.id===p.id?'selected':''}" onclick="cselectPractice('${x.id}')"><img src="${z.img}"><b>${z.name}</b><br><span class="small">${status(x)}</span></div>`}).join("")}</div>
<br><h2>② 今日の練習時間</h2><div class="grid">${[10,20,30,40,50,60,90,120].map(m=>`<button onclick="register(${m})">${m}分</button>`).join("")}</div>
<p class="small">※ 120分を超える場合は「120分〜」を選んで後から正確な時間を入力できる仕様にできます。</p>`}</div>
<div class="card"><h2>🎁 登録すると</h2><div class="grid"><div class="item">⭐<br><b>EXP</b><br>ペットが成長</div><div class="item">🪙<br><b>コイン</b><br>アイテム交換</div><div class="item">🎁<br><b>ランダム</b><br>プレゼント</div><div class="item">🔥<br><b>連続練習</b><br>ボーナス</div></div></div>`;
}
function cselectPractice(id){child().selected=id;practice()}
function register(min){
let c=child();if(c.lastRegistered===todayKey())return showToast("今日はもう登録済みです。明日また練習しよう！");
let p=P(),b=B(p.id),before=stage(p.exp),exp=min,coin=min;
if(p.id==="インコ")exp=Math.round(min*1.15);
if(p.id==="オカメ"){let streakBonus=Math.min(30,p.streak*5);exp+=streakBonus}
if(p.id==="シマエナガ"&&p.streak>=14)coin+=20;
p.exp+=exp;p.last=Date.now();p.streak=Math.max(1,p.streak+1);c.lastRegistered=todayKey();c.lastMinutes=min;c.coin+=coin;
let giftRate=p.id==="文鳥"?.48:.15;if(Math.random()<giftRate){let it=shopItems[Math.floor(Math.random()*shopItems.length)];p.items.push(it[0]);p.lastGift=it[1]}
if(min>=30&&!c.achievements.includes("30分練習"))c.achievements.push("30分練習");
let after=stage(p.exp);
home();
let msg=`🎉 今日のごほうび！\n⭐ +${exp} EXP\n🪙 +${coin}コイン`;
if(after[1]!==before[1])msg+=`\\n\\n🎊 ${b.name}が「${after[1]}」に成長しました！`;
if(p.lastGift)msg+=`\\n🎁 プレゼント「${p.lastGift}」もGET！`;
setTimeout(()=>showToast(msg),150);
}
function pets(){
let c=child();app.innerHTML=`<div class="card"><h2>🐦 ペットたち</h2><p class="small">4種類を選んで、好きな子を育てられます。</p><div class="petgrid">${birds.map(b=>{let p=c.pets.find(x=>x.id===b.id);return `<div class="petbox ${p?'selected':''}" onclick="cselect('${b.id}')"><img src="${b.img}"><b>${b.name}</b><br><span class="small">${p?`Lv.${level(p.exp)}・${status(p)}`:"🥚 たまごを迎える"}</span></div>`}).join("")}</div></div>
<div class="card"><h2>✨ 4羽の個性</h2>${birds.map(b=>`<p>• <b>${b.name}</b>：${b.type}</p>`).join("")}</div>`;
}
function shop(){
let c=child(),p=P();app.innerHTML=`<div class="card"><div class="row"><h2>🎁 ごほうびショップ</h2><b>🪙 ${c.coin}</b></div><p class="small">家庭学習でもらったコインで、ペットをかわいくしよう！</p><div class="items">${shopItems.map(x=>`<div class="item"><div style="font-size:28px">${x[0]}</div><b>${x[1]}</b><br>🪙 ${x[2]}<br><button onclick="buy('${x[0]}',${x[2]})">交換</button></div>`).join("")}</div></div>
<div class="card"><h2>🐦 ${B(p.id).name}のアイテム</h2><p style="font-size:22px">${p.items.join("　")||"まだありません"}</p></div>`;
}
function buy(icon,cost){let c=child(),p=P();if(c.coin<cost)return showToast("🪙 コインが足りません");c.coin-=cost;p.items.push(icon);shop();showToast("🎁 アイテムをGETしました！")}
function records(){
let c=child();let starList=c.pets.filter(p=>p.stars>0);app.innerHTML=`<div class="card"><h2>🌟 星のアルバム</h2><div class="notice">星になったペットも、大切な思い出として残ります。練習した日数やEXPも記録していきます。</div>${starList.length?starList.map(p=>`<div class="item" style="margin:8px 0;text-align:left">🌟 ${B(p.id).name}<br>星になった回数：${p.stars}回</div>`).join(""):`<p class="small">まだ星になったペットはいません。</p>`}</div>
<div class="card"><h2>🏆 実績バッジ</h2><div class="items">${["🌱 はじめの一歩","🔥 3日連続","🔥🔥 7日連続","🐣 ふ化成功","🐦 成鳥","🐦🐦🐦🐦 4種類育成","⏱️ 30分練習"].map(x=>`<div class="item ${c.achievements.some(a=>x.includes(a))?'':'locked'}">${x}</div>`).join("")}</div></div>`;
}
function checkStars(){
let c=child();for(let i=c.pets.length-1;i>=0;i--){let p=c.pets[i];if(age(p)>=7){let b=B(p.id);p.stars++;c.coin+=50;c.pets[i]={id:p.id,exp:0,last:Date.now(),streak:0,items:[],stars:p.stars};showToast(`🌟 ${b.name}が星になりました。新しいたまごから、また育てよう！`);}}
}
checkStars();home();
</script>
</body></html>
